[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openmw-mcp"
version = "0.10.0"
description = "MCP-openMW: wspólny serwer MCP (analiza, emulacja i porównania wizualne) dla oficjalnego OpenMW 0.51.0 (Flatpak) i forka OpenMW RLF"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "pillow>=9"]
capture = ["pillow>=9"]

[project.scripts]
openmw-mcp = "openmw_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
