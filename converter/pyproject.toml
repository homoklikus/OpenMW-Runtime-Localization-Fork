[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mwconv"
version = "0.1.0"
description = "Konwerter danych Morrowinda (NIF/ESM/ESP/BSA/LAND) do glTF i modelu świata dla MWGodot"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["numpy>=1.24", "pillow>=10.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mwconv = "mwconv.cli:main"

[tool.setuptools.packages.find]
include = ["mwconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
